name: smart_assistant_uni
description: "UET Narowal Smart Assistant: a student-guide app with a campus chatbot, campus map and department info."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  http: ^1.2.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - data/faq.json
    - data/buildings.json
    - data/departments.json
    - data/events.json
